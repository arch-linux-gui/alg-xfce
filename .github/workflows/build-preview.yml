name: Build and Release Preview

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    outputs:
      iso_name: ${{ steps.iso_info.outputs.iso_name }}
      iso_size: ${{ steps.iso_info.outputs.iso_size }}
      iso_sha256: ${{ steps.iso_info.outputs.iso_sha256 }}
      release_tag: ${{ steps.iso_info.outputs.release_tag }}
      artifact_name: ${{ steps.iso_info.outputs.artifact_name }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Update system and install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel grub efibootmgr
      
      - name: Configure pacman for parallel downloads
        run: |
          sed -i 's/^#ParallelDownloads/ParallelDownloads/' /etc/pacman.conf
      
      - name: Validate profile
        run: |
          if [ ! -f profiledef.sh ]; then
            echo "Error: profiledef.sh not found"
            exit 1
          fi
          source ./profiledef.sh
          echo "Building ISO: ${iso_name} version ${iso_version}"
      
      - name: Build ISO
        run: |
          mkdir -p /tmp/archiso-work
          mkdir -p /tmp/archiso-out
          mkarchiso -v -w /tmp/archiso-work -o /tmp/archiso-out .
      
      - name: Get ISO information
        id: iso_info
        run: |
          ISO_PATH=$(find /tmp/archiso-out -name "*.iso" -type f | head -n 1)
          ISO_NAME=$(basename "$ISO_PATH")
          ISO_SIZE=$(du -h "$ISO_PATH" | cut -f1)
          ISO_SHA256=$(sha256sum "$ISO_PATH" | cut -d' ' -f1)
          
          # Get version from profiledef.sh (format: yyyy.mm)
          source $GITHUB_WORKSPACE/profiledef.sh
          RELEASE_VERSION="${iso_version}"
          RELEASE_TAG="alg-xfce-${RELEASE_VERSION}"
          
          # Sanitize artifact name (replace / with -)
          ARTIFACT_NAME="${RELEASE_TAG//\//-}"
          
          echo "iso_path=$ISO_PATH" >> $GITHUB_OUTPUT
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "iso_size=$ISO_SIZE" >> $GITHUB_OUTPUT
          echo "iso_sha256=$ISO_SHA256" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          
          # Create checksums file
          cd /tmp/archiso-out
          sha256sum *.iso > SHA256SUMS
      
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.iso_info.outputs.artifact_name }}
          path: |
            /tmp/archiso-out/*.iso
            /tmp/archiso-out/SHA256SUMS
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./release-files
      
      - name: Create release notes
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          cat > release-notes.md << EOF
          ## ALG XFCE Release
          
          **Build Date:** ${BUILD_DATE}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ### ISO Information
          - **Filename:** ${{ needs.build.outputs.iso_name }}
          - **Size:** ${{ needs.build.outputs.iso_size }}
          - **SHA256:** \`${{ needs.build.outputs.iso_sha256 }}\`
          
          ### Installation
          1. Download the ISO file
          2. Verify the checksum using SHA256SUMS
          3. Write to USB using dd, Ventoy, or similar tools:
             \`\`\`bash
             dd if=${{ needs.build.outputs.iso_name }} of=/dev/sdX bs=4M status=progress
             \`\`\`
          4. Boot from the USB drive
          
          ### Verification
          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`
          
          EOF
          cat release-notes.md
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_tag }}
          body_path: release-notes.md
          draft: false
          prerelease: true
          files: |
            ./release-files/*.iso
            ./release-files/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
